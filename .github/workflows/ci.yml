name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Run browser smoke against a local production server
        run: |
          set -euo pipefail
          npx vite --host 127.0.0.1 --port 5199 > /tmp/star67-vite.log 2>&1 &
          server_pid=$!
          cleanup() { kill "$server_pid" 2>/dev/null || true; }
          trap cleanup EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:5199/ >/dev/null; then
              npm run smoke -- http://127.0.0.1:5199
              exit $?
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat /tmp/star67-vite.log
              exit 1
            fi
            sleep 1
          done
          cat /tmp/star67-vite.log
          echo 'Vite did not become ready in 30 seconds' >&2
          exit 1
